apiVersion: v1
kind: Service
metadata:
  name: {{ include "ollama.fullname" . }}
  labels: {{- include "ollama.labels" . | nindent 4 }}
spec:
  ports:
    - {name: http, port: {{ .Values.port }}, targetPort: http}
  selector:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: {{ .Release.Name }}
