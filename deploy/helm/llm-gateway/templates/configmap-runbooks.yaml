apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-gateway.fullname" . }}-runbooks
  labels: {{- include "llm-gateway.labels" . | nindent 4 }}
data:
  runbooks.yaml: |
{{- if .Values.runbooks }}
{{ .Values.runbooks | indent 4 }}
{{- else }}
{{ .Files.Get "files/runbooks.yaml" | indent 4 }}
{{- end }}
