apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-gateway.fullname" . }}
  labels:
    {{- include "llm-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "llm-gateway.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "llm-gateway.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/runbooks: {{ include (print $.Template.BasePath "/configmap-runbooks.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: seed-runbooks
          image: {{ include "llm-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "mkdir -p /data/chroma /data/hf && cp -n /seed/runbooks.yaml /data/runbooks.yaml || true"]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: seed, mountPath: /seed}
      containers:
        - name: gateway
          image: {{ include "llm-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: VECTOR_DB_DIR, value: /data/chroma}
            - {name: RUNBOOKS_PATH, value: /data/runbooks.yaml}
            - {name: HF_HOME, value: /data/hf}
            - {name: OLLAMA_URL, value: {{ include "llm-gateway.ollamaUrl" . | quote }}}
            - {name: DEFAULT_MODEL, value: {{ .Values.gateway.env.defaultModel | quote }}}
            - {name: CHEAP_MODEL, value: {{ .Values.gateway.env.cheapModel | quote }}}
            - {name: CACHE_DISTANCE_THRESHOLD, value: {{ .Values.gateway.env.cacheDistanceThreshold | quote }}}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "llm-gateway.fullname" .)) .Values.gateway.persistence.existingClaim }}
        - name: seed
          configMap:
            name: {{ include "llm-gateway.fullname" . }}-runbooks
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
