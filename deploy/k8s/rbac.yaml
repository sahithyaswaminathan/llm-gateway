apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-gateway-watcher
  namespace: llm-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llm-gateway-watcher
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llm-gateway-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llm-gateway-watcher
subjects:
  - kind: ServiceAccount
    name: llm-gateway-watcher
    namespace: llm-gateway
