services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-qwen2.5:3b}
      VECTOR_DB_DIR: /data/chroma
      RUNBOOKS_PATH: /data/runbooks.yaml
    volumes:
      - gwdata:/data
    command: sh -c "cp -n /code/runbooks.yaml /data/runbooks.yaml; uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      ollama-model:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.5.7
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 12

  ollama-model:
    image: ollama/ollama:0.5.7
    entrypoint: ["ollama"]
    command: ["pull", "${DEFAULT_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  gwdata:
  ollamadata:
